<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHL Assessment Recommender</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --shl: #6DC04B;
    --shl-dim: #4e9a30;
    --shl-glow: rgba(109,192,75,0.12);
    --shl-pale: #edfae3;
    --bg: #0e0e0f;
    --bg2: #161618;
    --bg3: #1e1e21;
    --bg4: #26262a;
    --line: rgba(255,255,255,0.07);
    --line2: rgba(255,255,255,0.12);
    --txt: #e8e8e8;
    --txt2: #9a9a9a;
    --txt3: #5a5a5a;
    --user-bg: #1a2e15;
    --user-border: rgba(109,192,75,0.25);
    --bot-bg: #1c1c20;
    --bot-border: rgba(255,255,255,0.08);
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--txt);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOP BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 56px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .logo-badge {
    width: 32px; height: 32px;
    background: var(--shl);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px; color: #fff;
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }
  .topbar-title { font-size: 15px; font-weight: 500; color: var(--txt); }
  .topbar-sub   { font-size: 12px; color: var(--txt2); margin-top: 1px; }

  .topbar-right { display: flex; align-items: center; gap: 10px; }

  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--txt3);
    transition: background 0.4s;
    flex-shrink: 0;
  }
  .status-dot.ok  { background: var(--shl); box-shadow: 0 0 6px rgba(109,192,75,0.6); }
  .status-dot.err { background: #e24b4b; }

  .status-label { font-size: 12px; color: var(--txt2); font-family: 'DM Mono', monospace; }

  .api-input-wrap {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg3);
    border: 1px solid var(--line2);
    border-radius: var(--radius-sm);
    padding: 0 10px;
    height: 32px;
  }
  .api-input-wrap label { font-size: 11px; color: var(--txt3); white-space: nowrap; }
  .api-input-wrap input {
    background: none; border: none; outline: none;
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--txt);
    width: 190px;
  }

  .btn-check {
    height: 28px; padding: 0 12px;
    background: var(--shl-glow);
    border: 1px solid rgba(109,192,75,0.3);
    border-radius: 6px;
    color: var(--shl);
    font-size: 12px; font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, border 0.2s;
    white-space: nowrap;
  }
  .btn-check:hover { background: rgba(109,192,75,0.2); border-color: rgba(109,192,75,0.5); }

  .btn-clear {
    height: 28px; padding: 0 12px;
    background: transparent;
    border: 1px solid var(--line2);
    border-radius: 6px;
    color: var(--txt2);
    font-size: 12px; cursor: pointer;
    transition: background 0.2s;
  }
  .btn-clear:hover { background: var(--bg3); color: var(--txt); }

  /* ── MAIN LAYOUT ── */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 240px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    background: var(--bg);
    flex-shrink: 0;
  }
  .sidebar-head {
    padding: 16px;
    border-bottom: 1px solid var(--line);
    font-size: 11px; font-weight: 500;
    color: var(--txt3);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .sidebar-body { flex: 1; overflow-y: auto; padding: 12px 8px; }
  .sidebar-body::-webkit-scrollbar { width: 4px; }
  .sidebar-body::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }

  .quick-btn {
    width: 100%;
    text-align: left;
    padding: 9px 10px;
    background: none;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--txt2);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    line-height: 1.35;
    display: block;
    margin-bottom: 2px;
  }
  .quick-btn:hover { background: var(--bg3); color: var(--txt); }
  .quick-btn .qlabel {
    font-size: 10px; color: var(--txt3);
    font-family: 'DM Mono', monospace;
    display: block; margin-bottom: 2px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .sidebar-section {
    padding: 8px 10px 4px;
    font-size: 10px; color: var(--txt3);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-top: 6px;
  }

  /* ── CHAT AREA ── */
  .chat-area {
    flex: 1;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .messages {
    flex: 1; overflow-y: auto;
    padding: 24px 0;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 5px; }
  .messages::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%;
    text-align: center; padding: 32px;
  }
  .empty-icon {
    width: 56px; height: 56px;
    background: var(--shl-glow);
    border: 1px solid rgba(109,192,75,0.2);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    margin-bottom: 16px;
  }
  .empty-state h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
  .empty-state p  { font-size: 13px; color: var(--txt2); max-width: 320px; line-height: 1.6; }

  /* ── MESSAGE ROW ── */
  .msg-row {
    display: flex; padding: 0 24px; margin-bottom: 16px;
    animation: fadeUp 0.25s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { justify-content: flex-end; }
  .msg-row.bot  { justify-content: flex-start; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    flex-shrink: 0; margin-top: 2px;
  }
  .msg-row.bot  .msg-avatar { background: var(--shl); color: #fff; margin-right: 10px; }
  .msg-row.user .msg-avatar { background: var(--bg4); color: var(--txt2); margin-left: 10px; order: 2; }

  .msg-content { max-width: 68%; }

  .msg-bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 14px; line-height: 1.6;
  }
  .msg-row.user .msg-bubble {
    background: var(--user-bg);
    border: 1px solid var(--user-border);
    border-radius: var(--radius) var(--radius) 4px var(--radius);
    color: #d4f0c0;
  }
  .msg-row.bot .msg-bubble {
    background: var(--bot-bg);
    border: 1px solid var(--bot-border);
    border-radius: var(--radius) var(--radius) var(--radius) 4px;
    color: var(--txt);
  }

  /* ── TYPING ── */
  .typing-dots { display: flex; gap: 4px; align-items: center; height: 20px; padding: 0 4px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--txt3);
    animation: blink 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%,80%,100% { opacity: 0.2; transform: scale(0.8); }
    40%          { opacity: 1;   transform: scale(1); }
  }

  /* ── RECOMMENDATIONS ── */
  .recs-wrap { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .rec-card {
    background: var(--bg3);
    border: 1px solid var(--line2);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex; align-items: flex-start; gap: 12px;
    transition: border-color 0.2s;
    text-decoration: none;
    cursor: pointer;
  }
  .rec-card:hover { border-color: rgba(109,192,75,0.4); }

  .rec-badge {
    min-width: 28px; height: 28px;
    background: var(--shl-glow);
    border: 1px solid rgba(109,192,75,0.3);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    color: var(--shl);
    font-family: 'DM Mono', monospace;
    flex-shrink: 0;
  }
  .rec-info { flex: 1; min-width: 0; }
  .rec-name {
    font-size: 13px; font-weight: 500; color: var(--txt);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .rec-url {
    font-size: 11px; color: var(--txt3);
    font-family: 'DM Mono', monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rec-arrow { color: var(--txt3); font-size: 14px; margin-top: 4px; transition: color 0.2s; }
  .rec-card:hover .rec-arrow { color: var(--shl); }

  .recs-header {
    font-size: 11px; color: var(--txt3);
    font-family: 'DM Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.6px;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .recs-count {
    background: var(--shl-glow);
    border: 1px solid rgba(109,192,75,0.25);
    border-radius: 20px;
    padding: 1px 7px;
    font-size: 10px; color: var(--shl);
  }

  /* ── TYPE LEGEND ── */
  .type-legend {
    font-size: 11px; color: var(--txt3);
    margin-top: 6px;
    line-height: 1.5;
  }
  .type-chip {
    display: inline-block;
    background: var(--bg4); border: 1px solid var(--line2);
    border-radius: 4px; padding: 1px 6px;
    font-family: 'DM Mono', monospace;
    font-size: 10px; color: var(--txt2);
    margin-right: 3px;
  }

  /* ── INPUT BAR ── */
  .input-bar {
    padding: 16px 24px;
    border-top: 1px solid var(--line);
    background: var(--bg);
    flex-shrink: 0;
  }
  .input-wrap {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--bg3);
    border: 1px solid var(--line2);
    border-radius: var(--radius);
    padding: 10px 14px;
    transition: border-color 0.2s;
  }
  .input-wrap:focus-within { border-color: rgba(109,192,75,0.4); }

  textarea {
    flex: 1; background: none; border: none; outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: var(--txt);
    resize: none; line-height: 1.5;
    max-height: 120px;
    min-height: 22px;
  }
  textarea::placeholder { color: var(--txt3); }

  .send-btn {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--shl);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, transform 0.1s;
  }
  .send-btn:hover   { background: var(--shl-dim); }
  .send-btn:active  { transform: scale(0.93); }
  .send-btn:disabled { background: var(--bg4); cursor: not-allowed; }
  .send-btn svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .input-hint {
    font-size: 11px; color: var(--txt3);
    text-align: center; margin-top: 8px;
  }
  .input-hint kbd {
    background: var(--bg4); border: 1px solid var(--line2);
    border-radius: 3px; padding: 1px 5px;
    font-family: 'DM Mono', monospace; font-size: 10px;
  }

  /* ── TURN COUNTER ── */
  .turn-info {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; padding: 6px 24px 0;
    font-size: 11px; color: var(--txt3);
    font-family: 'DM Mono', monospace;
  }
  .turn-bar {
    display: flex; gap: 3px;
  }
  .turn-pip {
    width: 14px; height: 3px; border-radius: 2px;
    background: var(--bg4);
    transition: background 0.3s;
  }
  .turn-pip.used { background: var(--shl); }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--bg3); border: 1px solid var(--line2);
    border-radius: var(--radius-sm);
    padding: 10px 18px;
    font-size: 13px; color: var(--txt);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── EOC BADGE ── */
  .eoc-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg4); border: 1px solid var(--line2);
    border-radius: 20px; padding: 4px 12px;
    font-size: 12px; color: var(--txt2);
    margin-top: 10px;
  }
  .eoc-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--shl); }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo-badge">SHL</div>
    <div>
      <div class="topbar-title">Assessment Recommender</div>
      <div class="topbar-sub">Individual Test Solutions · v1.0.0</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="api-input-wrap">
      <label>API</label>
      <input type="text" id="apiUrl" value="window.location.origin" placeholder="window.location.origin" />
    </div>
    <button class="btn-check" onclick="checkHealth()">Check health</button>
    <div style="display:flex;align-items:center;gap:6px;">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-label" id="statusLabel">–</span>
    </div>
    <button class="btn-clear" onclick="clearChat()">Clear chat</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-head">Quick prompts</div>
    <div class="sidebar-body">

      <div class="sidebar-section">By role</div>
      <button class="quick-btn" onclick="sendQuick('I am hiring a mid-level Java developer who works closely with stakeholders and needs strong communication skills.')">
        <span class="qlabel">Software</span>
        Java developer, mid-level
      </button>
      <button class="quick-btn" onclick="sendQuick('I need assessments for a customer service manager leading a contact center team of 20 people.')">
        <span class="qlabel">Operations</span>
        Customer service manager
      </button>
      <button class="quick-btn" onclick="sendQuick('Looking for assessments for a senior data analyst with Python and SQL skills.')">
        <span class="qlabel">Analytics</span>
        Senior data analyst
      </button>
      <button class="quick-btn" onclick="sendQuick('I am hiring a graduate-level sales representative for B2B enterprise sales.')">
        <span class="qlabel">Sales</span>
        Graduate sales rep
      </button>
      <button class="quick-btn" onclick="sendQuick('Need assessments for a front-line supervisor in a manufacturing environment.')">
        <span class="qlabel">Operations</span>
        Manufacturing supervisor
      </button>

      <div class="sidebar-section">Specific needs</div>
      <button class="quick-btn" onclick="sendQuick('I need a personality assessment only, remote testing enabled, for a senior manager role.')">
        <span class="qlabel">Personality</span>
        Personality only, remote
      </button>
      <button class="quick-btn" onclick="sendQuick('What cognitive ability tests does SHL offer for graduate-level hiring?')">
        <span class="qlabel">Cognitive</span>
        Cognitive / graduate
      </button>
      <button class="quick-btn" onclick="sendQuick('What is the difference between OPQ32r and the Motivational Questionnaire?')">
        <span class="qlabel">Compare</span>
        OPQ32r vs MQ
      </button>

    </div>
  </div>

  <!-- CHAT -->
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🎯</div>
        <h2>SHL Assessment Recommender</h2>
        <p>Describe the role you're hiring for and I'll suggest the right SHL Individual Test Solutions from the catalog.</p>
      </div>
    </div>

    <!-- TURN COUNTER -->
    <div class="turn-info" id="turnInfo" style="display:none;">
      <span>Turn</span>
      <div class="turn-bar" id="turnBar"></div>
      <span id="turnCount">0 / 8</span>
    </div>

    <!-- INPUT -->
    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="msgInput" placeholder="Describe the role you're hiring for…" rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-hint"><kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> for new line</div>
    </div>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const TYPE_LABELS = {
  A:'Ability & Aptitude', B:'Biodata / SJT', C:'Competencies',
  D:'Development & 360', E:'Exercises', K:'Knowledge & Skills',
  P:'Personality & Behavior', S:'Simulations'
};

let history = [];
let busy    = false;

function apiBase() {
  return document.getElementById('apiUrl').value.replace(/\/+$/, '');
}

/* ── HEALTH ── */
async function checkHealth() {
  const dot   = document.getElementById('statusDot');
  const label = document.getElementById('statusLabel');
  dot.className   = 'status-dot';
  label.textContent = 'checking…';
  try {
    const r = await fetch(apiBase() + '/health', { signal: AbortSignal.timeout(5000) });
    const j = await r.json();
    if (r.ok && j.status === 'ok') {
      dot.className   = 'status-dot ok';
      label.textContent = 'online';
      toast('API is online ✓', 2000);
    } else {
      throw new Error();
    }
  } catch {
    dot.className   = 'status-dot err';
    label.textContent = 'offline';
    toast('Cannot reach API — is uvicorn running?', 3000);
  }
}

/* ── SEND ── */
async function sendMessage() {
  if (busy) return;
  const input = document.getElementById('msgInput');
  const text  = input.value.trim();
  if (!text) return;

  hideEmpty();
  input.value = '';
  autoResize(input);

  history.push({ role: 'user', content: text });
  appendBubble('user', text);
  updateTurnBar();

  const typingId = appendTyping();
  busy = true;
  document.getElementById('sendBtn').disabled = true;

  try {
    const r = await fetch(apiBase() + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
      signal: AbortSignal.timeout(35000),
    });

    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    removeTyping(typingId);

    const { reply, recommendations, end_of_conversation } = data;
    history.push({ role: 'assistant', content: reply });

    appendBotMessage(reply, recommendations || [], end_of_conversation);
    updateTurnBar();

    if (end_of_conversation) {
      toast('Conversation complete — clear to start a new search', 4000);
    }
  } catch (e) {
    removeTyping(typingId);
    appendBotMessage(
      'Could not reach the API. Make sure uvicorn is running at ' + apiBase(),
      [], false, true
    );
  }

  busy = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('msgInput').focus();
}

function sendQuick(text) {
  document.getElementById('msgInput').value = text;
  autoResize(document.getElementById('msgInput'));
  sendMessage();
}

/* ── DOM HELPERS ── */
function hideEmpty() {
  const e = document.getElementById('emptyState');
  if (e) e.remove();
}

function appendBubble(role, text) {
  const wrap = document.createElement('div');
  wrap.className = `msg-row ${role}`;
  const initial = role === 'bot' ? 'S' : 'U';
  const avatarStyle = role === 'bot' ? '' : '';
  wrap.innerHTML = `
    <div class="msg-avatar">${initial === 'S' ? 'SHL' : 'You'}</div>
    <div class="msg-content">
      <div class="msg-bubble">${escHtml(text)}</div>
    </div>
  `;
  if (role === 'user') {
    wrap.querySelector('.msg-avatar').textContent = 'You';
  } else {
    wrap.querySelector('.msg-avatar').textContent = 'SHL';
  }
  document.getElementById('messages').appendChild(wrap);
  scrollBottom();
  return wrap;
}

function appendTyping() {
  const id  = 'typing-' + Date.now();
  const wrap = document.createElement('div');
  wrap.className = 'msg-row bot';
  wrap.id = id;
  wrap.innerHTML = `
    <div class="msg-avatar">SHL</div>
    <div class="msg-content">
      <div class="msg-bubble">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  `;
  document.getElementById('messages').appendChild(wrap);
  scrollBottom();
  return id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function appendBotMessage(reply, recs, eoc, isError) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-row bot';

  let recsHtml = '';
  if (recs.length > 0) {
    const cards = recs.map(r => {
      const typeLabel = TYPE_LABELS[r.test_type] || r.test_type || '?';
      const shortUrl  = r.url.replace('https://www.shl.com/products/product-catalog/view/', '').replace(/\/$/, '');
      return `
        <a class="rec-card" href="${r.url}" target="_blank" rel="noopener" title="${escHtml(r.name)}">
          <div class="rec-badge">${escHtml(r.test_type || '?')}</div>
          <div class="rec-info">
            <div class="rec-name">${escHtml(r.name)}</div>
            <div class="rec-url">${escHtml(shortUrl)}</div>
          </div>
          <div class="rec-arrow">↗</div>
        </a>
      `;
    }).join('');

    recsHtml = `
      <div class="recs-wrap">
        <div class="recs-header">
          Recommendations
          <span class="recs-count">${recs.length}</span>
        </div>
        ${cards}
        <div class="type-legend">
          ${Object.entries(TYPE_LABELS).map(([k,v]) =>
            `<span class="type-chip">${k}</span>${v}`
          ).join(' &nbsp; ')}
        </div>
      </div>
    `;
  }

  const eocHtml = eoc
    ? `<div class="eoc-badge"><div class="eoc-dot"></div>Conversation complete</div>` : '';

  const errStyle = isError ? 'color: #e24b4b;' : '';

  wrap.innerHTML = `
    <div class="msg-avatar">SHL</div>
    <div class="msg-content" style="max-width: 78%;">
      <div class="msg-bubble" style="${errStyle}">${escHtml(reply)}</div>
      ${recsHtml}
      ${eocHtml}
    </div>
  `;
  document.getElementById('messages').appendChild(wrap);
  scrollBottom();
}

/* ── TURN BAR ── */
function updateTurnBar() {
  const turns = history.length;
  const bar   = document.getElementById('turnBar');
  const label = document.getElementById('turnCount');
  const info  = document.getElementById('turnInfo');
  info.style.display = 'flex';
  bar.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const pip = document.createElement('div');
    pip.className = 'turn-pip' + (i < turns ? ' used' : '');
    bar.appendChild(pip);
  }
  label.textContent = `${turns} / 8`;
  if (turns >= 6) label.style.color = '#e2a24a';
  else            label.style.color = '';
}

/* ── CLEAR ── */
function clearChat() {
  history = [];
  const msgs = document.getElementById('messages');
  msgs.innerHTML = `
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🎯</div>
      <h2>SHL Assessment Recommender</h2>
      <p>Describe the role you're hiring for and I'll suggest the right SHL Individual Test Solutions from the catalog.</p>
    </div>
  `;
  document.getElementById('turnInfo').style.display = 'none';
}

/* ── UTILS ── */
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, dur = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

/* ── INIT ── */
checkHealth();
document.getElementById('msgInput').focus();
</script>
